<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dinacharya — Daily Wellness Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20304D;
    --ink-soft:#5B6A87;
    --bone:#F6F1E4;
    --card:#FFFDF8;
    --card-line:#E7DEC6;
    --copper:#A6522C;
    --copper-soft:#C97B4F;
    --turmeric:#C98A2B;
    --sage:#6E8564;
    --sage-soft:#9AAA8B;
    --shadow: 0 1px 2px rgba(32,48,77,0.06), 0 6px 20px rgba(32,48,77,0.07);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bone);}
  body{
    font-family:'Inter',sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  @media (min-width:520px){
    body{ background:
      radial-gradient(circle at 20% 10%, #EFE6CC 0%, transparent 45%),
      var(--bone);
      padding:28px 0;
    }
  }
  .app{
    width:100%;
    max-width:440px;
    min-height:100vh;
    background:var(--bone);
    position:relative;
    display:flex;
    flex-direction:column;
  }
  @media (min-width:520px){
    .app{ min-height:auto; border-radius:28px; box-shadow:0 20px 60px rgba(32,48,77,0.18); overflow:hidden; border:1px solid var(--card-line); }
  }
  header.top{
    padding:22px 22px 6px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--copper);
    font-weight:600;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:28px;
    margin:4px 0 2px;
    line-height:1.1;
  }
  .sub{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 6px;
  }
  /* ---- arc ---- */
  .arc-wrap{ padding:6px 10px 0; }
  .arc-wrap svg{ width:100%; height:auto; display:block; }
  .arc-node circle.ring{ fill:var(--card); stroke:var(--card-line); stroke-width:1.6; transition:stroke .25s, fill .25s; }
  .arc-node.filled circle.ring{ fill:var(--copper); stroke:var(--copper); }
  .arc-node .glyph{ stroke:var(--ink-soft); stroke-width:1.7; fill:none; stroke-linecap:round; stroke-linejoin:round; transition:stroke .25s; }
  .arc-node.filled .glyph{ stroke:#FFFDF8; }
  .arc-node{ cursor:pointer; }
  .arc-track{ fill:none; stroke:var(--card-line); stroke-width:1.4; stroke-dasharray:1 7; stroke-linecap:round; }
  .arc-caption{
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    margin:-6px 0 4px;
    letter-spacing:.03em;
  }
  .arc-caption b{ color:var(--copper); font-weight:600; }

  /* ---- day nav ---- */
  .day-row{
    display:flex; align-items:center; justify-content:center; gap:14px;
    padding:2px 20px 10px;
  }
  .day-row .day-label{
    font-family:'Fraunces',serif;
    font-size:20px;
    font-weight:600;
    min-width:96px;
    text-align:center;
  }
  .arrow-btn{
    width:34px;height:34px;border-radius:50%;
    border:1px solid var(--card-line);
    background:var(--card);
    display:flex;align-items:center;justify-content:center;
    color:var(--ink);
    cursor:pointer;
  }
  .arrow-btn:active{ background:var(--card-line); }
  .arrow-btn svg{ width:16px;height:16px; }

  /* ---- day strip ---- */
  .day-strip{
    display:flex; gap:6px; overflow-x:auto; padding:2px 20px 14px;
    scroll-snap-type:x proximity;
  }
  .day-strip::-webkit-scrollbar{ display:none; }
  .day-dot{
    flex:0 0 auto;
    width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
    background:var(--card); border:1px solid var(--card-line); color:var(--ink-soft);
    cursor:pointer; scroll-snap-align:center;
  }
  .day-dot.logged{ border-color:var(--sage-soft); color:var(--sage); background:#F0F4EC; }
  .day-dot.current{ background:var(--ink); color:var(--bone); border-color:var(--ink); }

  /* ---- tabs ---- */
  .tabs{
    margin:0 20px 14px; padding:3px;
    background:var(--card); border:1px solid var(--card-line); border-radius:12px;
    display:flex; gap:3px;
  }
  .tab-btn{
    flex:1; border:none; background:transparent; padding:9px 0;
    font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px; color:var(--ink-soft);
    border-radius:9px; cursor:pointer;
  }
  .tab-btn.active{ background:var(--ink); color:var(--bone); }

  main{ flex:1; padding:0 20px 110px; }

  /* ---- field cards ---- */
  .field-card{
    background:var(--card); border:1px solid var(--card-line); border-radius:16px;
    padding:14px 16px 16px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  .field-head{ display:flex; align-items:center; gap:9px; margin-bottom:11px; }
  .field-head .ficon{ width:20px;height:20px; stroke:var(--copper); stroke-width:1.8; fill:none; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto; }
  .field-head .flabel{ font-weight:600; font-size:14.5px; }

  .chip-group{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    border:1px solid var(--card-line); background:var(--bone);
    padding:8px 12px; border-radius:10px; font-size:13px; color:var(--ink);
    cursor:pointer; line-height:1.3;
  }
  .chip.selected{ background:var(--copper); border-color:var(--copper); color:#fff; font-weight:600; }
  .chip:focus-visible, .arrow-btn:focus-visible, .tab-btn:focus-visible, .day-dot:focus-visible{ outline:2px solid var(--turmeric); outline-offset:2px; }

  .toggle-row{ display:flex; align-items:center; justify-content:space-between; }
  .toggle-text{ font-size:13px; color:var(--ink-soft); }
  .droplet-toggle{ width:44px; height:44px; cursor:pointer; }
  .droplet-toggle path{ stroke:var(--card-line); stroke-width:1.8; fill:var(--bone); transition:fill .2s, stroke .2s; }
  .droplet-toggle.on path{ stroke:var(--sage); fill:var(--sage); }

  input[type="time"]{
    font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:600; color:var(--ink);
    border:1px solid var(--card-line); background:var(--bone); border-radius:10px;
    padding:9px 12px; width:100%;
  }

  .scale-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .scale-dot{
    width:31px;height:31px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600;
    background:var(--bone); border:1px solid var(--card-line); color:var(--ink-soft);
    cursor:pointer;
  }
  .scale-dot.selected{ color:#fff; border-color:transparent; }
  .scale-hint{ display:flex; justify-content:space-between; font-size:10.5px; color:var(--ink-soft); margin-top:6px; font-family:'IBM Plex Mono',monospace; }

  .note-row{ margin-top:14px; padding-top:12px; border-top:1px dashed var(--card-line); font-size:11.5px; color:var(--ink-soft); }

  /* ---- insights ---- */
  .insight-summary{ font-size:13px; color:var(--ink-soft); margin:0 0 14px; }
  .insight-summary b{ color:var(--ink); }
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat-card{
    background:var(--card); border:1px solid var(--card-line); border-radius:16px;
    padding:14px; box-shadow:var(--shadow);
  }
  .stat-num{ font-family:'Fraunces',serif; font-size:30px; font-weight:600; line-height:1; }
  .stat-num span{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-soft); font-weight:500; }
  .stat-label{ font-size:12px; color:var(--ink-soft); margin-top:6px; line-height:1.35; }
  .stat-bar{ height:5px; border-radius:3px; background:var(--bone); margin-top:10px; overflow:hidden; }
  .stat-bar i{ display:block; height:100%; border-radius:3px; }
  .disclaimer{ font-size:11px; color:var(--ink-soft); margin-top:16px; line-height:1.5; padding:12px; background:var(--card); border:1px solid var(--card-line); border-radius:12px; }
  .reset-link{ display:block; text-align:center; margin-top:18px; font-size:12px; color:var(--ink-soft); text-decoration:underline; background:none; border:none; cursor:pointer; font-family:'Inter',sans-serif; width:100%; }

  /* ---- toast / modal ---- */
  .toast{
    position:fixed; left:50%; bottom:22px; transform:translate(-50%,20px);
    background:var(--ink); color:var(--bone); font-size:12.5px; font-weight:500;
    padding:9px 16px; border-radius:20px; opacity:0; transition:opacity .25s, transform .25s;
    pointer-events:none; z-index:40; font-family:'Inter',sans-serif;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(32,48,77,0.45); display:none;
    align-items:center; justify-content:center; z-index:50; padding:24px;
  }
  .modal-overlay.show{ display:flex; }
  .modal-box{
    background:var(--card); border-radius:18px; padding:22px; max-width:340px; width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);
  }
  .modal-box h3{ font-family:'Fraunces',serif; margin:0 0 8px; font-size:19px; }
  .modal-box p{ font-size:13px; color:var(--ink-soft); margin:0 0 18px; line-height:1.5; }
  .modal-actions{ display:flex; gap:10px; }
  .modal-actions button{ flex:1; padding:11px 0; border-radius:10px; font-weight:600; font-size:13.5px; cursor:pointer; border:1px solid var(--card-line); }
  .modal-cancel{ background:var(--bone); color:var(--ink); }
  .modal-confirm{ background:var(--copper); color:#fff; border-color:var(--copper); }

  .loading{ padding:60px 20px; text-align:center; color:var(--ink-soft); font-size:13px; }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading" id="loading">Loading your log…</div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3>Reset all entries?</h3>
    <p>This clears every day you've logged in this 31-day sheet. This can't be undone.</p>
    <div class="modal-actions">
      <button class="modal-cancel" id="modalCancel">Cancel</button>
      <button class="modal-confirm" id="modalConfirm">Reset</button>
    </div>
  </div>
</div>

<script>
(function(){
  const TOTAL_DAYS = 31;
  const STORAGE_KEY = 'daily-log-data';

  const ICONS = {
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 3v2.4M12 18.6V21M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M3 12h2.4M18.6 12H21M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7"/>',
    drop: '<path d="M12 3.5c3.6 4.6 6.3 7.9 6.3 11.1a6.3 6.3 0 1 1-12.6 0c0-3.2 2.7-6.5 6.3-11.1z"/>',
    cycle: '<path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 3.5V8h-4.5"/>',
    wind: '<path d="M3.5 8h9.7a2.6 2.6 0 1 0-2.6-2.6"/><path d="M3.5 12.5h13a2.6 2.6 0 1 1-2.6 2.6"/><path d="M3.5 17h7.3"/>',
    flame: '<path d="M9 15.2A2.8 2.8 0 0 0 11.8 12c0-1.5-.6-2.2-1.1-3.3-1.2-2.3-.2-4.4 2.2-6.5.5 2.7 2.2 5.3 4.4 7.1 2.2 1.7 3.2 3.8 3.2 6 0 4.2-3.4 6.7-7.5 6.7S5.5 20.2 5.5 16a7.6 7.6 0 0 1 1.1-3.9A2.8 2.8 0 0 0 9 15.2z"/>',
    wave: '<path d="M2.5 10.5c2-2.6 4-2.6 6 0s4 2.6 6 0 4-2.6 6-0"/><path d="M2.5 16c2-2.6 4-2.6 6 0s4 2.6 6 0 4-2.6 6 0"/>',
    bolt: '<path d="M13.2 2.5 4.8 14h6l-1 7.5 8.4-11.5h-6l1-7.5z"/>',
    moon: '<path d="M20.8 13.6A8.7 8.7 0 1 1 10.4 3.2a7 7 0 0 0 10.4 10.4z"/>',
    sparkle: '<path d="M12 3.2 13.9 9 20 12l-6.1 3-1.9 5.8L10.1 15 4 12l6.1-3L12 3.2z"/>'
  };

  const FIELDS = [
    { key:'wake', label:'Wake-Up Time', icon:'sun', type:'time' },
    { key:'hydration', label:'Morning Hydration (Ushapan)', icon:'drop', type:'toggle' },
    { key:'bowel', label:'Bowel Movement (Koshtha)', icon:'cycle', type:'chips',
      options:['Clear & Normal','Sluggish/Incomplete','Constipated','Loose/Irregular'] },
    { key:'movement', label:'Movement / Exercise', icon:'wind', type:'chips',
      options:['30+ Min Walk/Cardio','Yoga/Pranayama','Strength Training','Light Activity','Rest Day'] },
    { key:'meal', label:'Meal Discipline & Agni', icon:'flame', type:'chips',
      options:['Timely & Balanced','Overate/Heavy','Late Meals','Skipped Meals'] },
    { key:'digestion', label:'Post-Meal Digestion', icon:'wave', type:'chips',
      options:['Optimal (No issues)','Gas/Bloating','Acidity/Heartburn','Heavy/Drowsy'] },
    { key:'stress', label:'Day Stress Level', icon:'bolt', type:'scale' },
    { key:'bedtime', label:'Bedtime Routine', icon:'moon', type:'chips',
      options:['5 - Deep & Restful','4 - Good','3 - Interrupted','2 - Disturbed','1 - Poor/Insomnia'] },
    { key:'sleep', label:'Sleep Quality & Rest', icon:'sparkle', type:'chips',
      options:['5 - Deep & Restful','4 - Good','3 - Interrupted','2 - Disturbed','1 - Poor/Insomnia'] }
  ];

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function emptyEntry(){
    return { wake:'', hydration:false, bowel:'', movement:'', meal:'', digestion:'', stress:0, bedtime:'', sleep:'' };
  }
  function defaultState(){
    return { entries: Array.from({length:TOTAL_DAYS}, emptyEntry), lastDay: 1 };
  }
  function isFilled(field, value){
    if(field.type==='toggle') return value === true;
    if(field.type==='scale') return value > 0;
    return !!value;
  }

  let state = defaultState();
  let view = 'log';
  let currentDay = 1;
  let saveTimer = null;

  async function loadData(){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        if(parsed && Array.isArray(parsed.entries) && parsed.entries.length===TOTAL_DAYS) return parsed;
      }
    }catch(e){ /* no saved data yet */ }
    return defaultState();
  }
  function scheduleSave(){
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(async ()=>{
      try{
        await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
        showToast('Saved');
      }catch(e){ showToast("Couldn't save — try again"); }
    }, 250);
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._h);
    showToast._h = setTimeout(()=>t.classList.remove('show'), 1500);
  }

  // ---------- arc geometry ----------
  function arcPoint(i, n, cx, cy, rx, ry){
    const t = n===1 ? 0.5 : i/(n-1);
    const angle = Math.PI - t*Math.PI; // 180deg -> 0deg
    return { x: cx + rx*Math.cos(angle), y: cy - ry*Math.sin(angle) };
  }

  function renderArc(){
    const entry = state.entries[currentDay-1];
    const n = FIELDS.length;
    const cx=180, cy=108, rx=158, ry=86;
    const pts = FIELDS.map((f,i)=>arcPoint(i,n,cx,cy,rx,ry));
    const start = pts[0], end = pts[n-1];
    let svg = `<svg viewBox="0 0 360 128" xmlns="http://www.w3.org/2000/svg">`;
    svg += `<path class="arc-track" d="M ${start.x} ${start.y} A ${rx} ${ry} 0 0 1 ${end.x} ${end.y}"/>`;
    FIELDS.forEach((f,i)=>{
      const p = pts[i];
      const filled = isFilled(f, entry[f.key]);
      svg += `<g class="arc-node ${filled?'filled':''}" data-jump="${f.key}" transform="translate(${p.x},${p.y})">`;
      svg += `<circle class="ring" r="15"/>`;
      svg += `<g class="glyph" transform="translate(-9,-9) scale(0.75)">${ICONS[f.icon]}</g>`;
      svg += `</g>`;
    });
    svg += `</svg>`;
    document.getElementById('arcSvg').innerHTML = svg;
    const filledCount = FIELDS.filter(f=>isFilled(f, entry[f.key])).length;
    document.getElementById('arcCaption').innerHTML = `<b>${filledCount}/${n}</b> logged for today`;

    document.querySelectorAll('.arc-node').forEach(node=>{
      node.addEventListener('click', ()=>{
        const key = node.getAttribute('data-jump');
        const card = document.querySelector(`.field-card[data-key="${key}"]`);
        if(card) card.scrollIntoView({behavior:'smooth', block:'center'});
      });
    });
  }

  // ---------- day log view ----------
  function fieldCardHTML(field){
    const entry = state.entries[currentDay-1];
    const val = entry[field.key];
    let inner = '';
    if(field.type==='chips'){
      inner = `<div class="chip-group">` + field.options.map(opt=>
        `<button class="chip ${val===opt?'selected':''}" data-key="${field.key}" data-value="${esc(opt)}">${esc(opt)}</button>`
      ).join('') + `</div>`;
    } else if(field.type==='toggle'){
      inner = `<div class="toggle-row">
        <span class="toggle-text">${val ? 'Hydrated on waking' : 'Tap the drop after your first glass of water'}</span>
        <svg class="droplet-toggle ${val?'on':''}" data-key="${field.key}" viewBox="0 0 24 24">
          <path d="M12 2.5c4 5.2 7 8.9 7 12.4a7 7 0 1 1-14 0c0-3.5 3-7.2 7-12.4z"/>
        </svg>
      </div>`;
    } else if(field.type==='time'){
      inner = `<input type="time" data-key="${field.key}" value="${val||''}">`;
    } else if(field.type==='scale'){
      let dots = '';
      for(let i=1;i<=10;i++){
        const on = val===i;
        const t = (i-1)/9;
        const color = mixColor(t);
        dots += `<div class="scale-dot ${on?'selected':''}" style="${on?`background:${color};`:''}" data-key="${field.key}" data-num="${i}">${i}</div>`;
      }
      inner = `<div class="scale-row">${dots}</div><div class="scale-hint"><span>1 · calm</span><span>10 · very stressed</span></div>`;
    }
    return `<div class="field-card" data-key="${field.key}">
      <div class="field-head"><svg class="ficon" viewBox="0 0 24 24">${ICONS[field.icon]}</svg><span class="flabel">${esc(field.label)}</span></div>
      ${inner}
    </div>`;
  }
  function mixColor(t){
    // sage (110,133,100) -> copper (166,82,44)
    const a=[110,133,100], b=[166,82,44];
    const c = a.map((v,i)=>Math.round(v+(b[i]-v)*t));
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }

  function renderDay(){
    document.getElementById('dayLabel').textContent = `Day ${currentDay}`;
    document.getElementById('content').innerHTML = FIELDS.map(fieldCardHTML).join('') +
      `<div class="note-row">Entries save automatically and privately to this device/link — only you see your log.</div>`;
  }

  function renderDayStrip(){
    let html = '';
    for(let d=1; d<=TOTAL_DAYS; d++){
      const logged = Object.values(state.entries[d-1]).some((v,idx)=>{
        const f = FIELDS[idx];
        return isFilled(f, v);
      });
      html += `<div class="day-dot ${logged?'logged':''} ${d===currentDay?'current':''}" data-day="${d}" tabindex="0">${d}</div>`;
    }
    document.getElementById('dayStrip').innerHTML = html;
    const cur = document.querySelector('.day-dot.current');
    if(cur) cur.scrollIntoView({inline:'center', block:'nearest'});
  }

  function goDay(d){
    currentDay = Math.min(TOTAL_DAYS, Math.max(1, d));
    state.lastDay = currentDay;
    scheduleSave();
    renderArc(); renderDay(); renderDayStrip();
  }

  // ---------- insights view ----------
  function computeStats(){
    const e = state.entries;
    const hydrationDays = e.filter(x=>x.hydration===true).length;
    const optimalBowel = e.filter(x=>x.bowel==='Clear & Normal').length;
    const activeMovement = e.filter(x=>x.movement && x.movement!=='Rest Day').length;
    const flareUp = e.filter(x=>['Gas/Bloating','Acidity/Heartburn','Heavy/Drowsy'].includes(x.digestion)).length;
    const highStress = e.filter(x=>x.stress>=7).length;
    const qualitySleep = e.filter(x=>x.sleep==='5 - Deep & Restful' || x.sleep==='4 - Good').length;
    const daysLogged = e.filter(day=>FIELDS.some(f=>isFilled(f, day[f.key]))).length;
    return { hydrationDays, optimalBowel, activeMovement, flareUp, highStress, qualitySleep, daysLogged };
  }

  function statCard(num, total, label, color){
    const pct = total? Math.min(100, Math.round(num/total*100)) : 0;
    return `<div class="stat-card">
      <div class="stat-num">${num}<span> / ${total}</span></div>
      <div class="stat-label">${label}</div>
      <div class="stat-bar"><i style="width:${pct}%; background:${color};"></i></div>
    </div>`;
  }

  function renderInsights(){
    const s = computeStats();
    const el = document.getElementById('insightsBody');
    if(s.daysLogged===0){
      el.innerHTML = `<p class="insight-summary">Nothing logged yet. Fill in Day 1 on the Today tab and your first insight will show up here.</p>`;
      return;
    }
    el.innerHTML = `
      <p class="insight-summary"><b>${s.daysLogged}/${TOTAL_DAYS}</b> days logged this month.</p>
      <div class="stat-grid">
        ${statCard(s.hydrationDays, 30, 'Morning Hydration Days (Goal: 30)', 'var(--sage)')}
        ${statCard(s.optimalBowel, TOTAL_DAYS, 'Optimal Bowel Movement Days', 'var(--sage)')}
        ${statCard(s.activeMovement, TOTAL_DAYS, 'Active Movement Days', 'var(--turmeric)')}
        ${statCard(s.flareUp, TOTAL_DAYS, 'Digestion Flare-Up Days (Gas/Acidity/Drowsy)', 'var(--copper)')}
        ${statCard(s.highStress, TOTAL_DAYS, 'High Stress Days (Rating 7+)', 'var(--copper)')}
        ${statCard(s.qualitySleep, TOTAL_DAYS, 'Quality Sleep Days (Rating 4-5)', 'var(--sage)')}
      </div>
      <div class="disclaimer">Note: This summary is based on self-reported lifestyle data and is intended for clinical consultation support, not medical diagnosis.</div>
      <button class="reset-link" id="resetBtn">Reset all entries</button>
    `;
    document.getElementById('resetBtn').addEventListener('click', ()=>{
      document.getElementById('modalOverlay').classList.add('show');
    });
  }

  // ---------- shell ----------
  function renderShell(){
    document.getElementById('app').innerHTML = `
      <header class="top">
        <div class="eyebrow">Dinacharya</div>
        <h1>Daily Wellness Log</h1>
        <p class="sub">A 31-day rhythm tracker for hydration, digestion, movement &amp; rest.</p>
      </header>
      <div class="arc-wrap"><div id="arcSvg"></div></div>
      <div class="arc-caption" id="arcCaption"></div>
      <div class="day-row">
        <div class="arrow-btn" id="prevDay" aria-label="Previous day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></div>
        <div class="day-label" id="dayLabel">Day 1</div>
        <div class="arrow-btn" id="nextDay" aria-label="Next day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></div>
      </div>
      <div class="day-strip" id="dayStrip"></div>
      <div class="tabs">
        <button class="tab-btn active" id="tabLog">Today</button>
        <button class="tab-btn" id="tabInsights">Insights</button>
      </div>
      <main>
        <div id="content"></div>
        <div id="insightsBody" style="display:none;"></div>
      </main>
    `;

    document.getElementById('prevDay').addEventListener('click', ()=>goDay(currentDay-1));
    document.getElementById('nextDay').addEventListener('click', ()=>goDay(currentDay+1));
    document.getElementById('dayStrip').addEventListener('click', (e)=>{
      const dot = e.target.closest('.day-dot');
      if(dot) goDay(parseInt(dot.getAttribute('data-day'),10));
    });
    document.getElementById('tabLog').addEventListener('click', ()=>switchView('log'));
    document.getElementById('tabInsights').addEventListener('click', ()=>switchView('insights'));

    document.getElementById('content').addEventListener('click', (e)=>{
      const chip = e.target.closest('.chip');
      if(chip){
        const key = chip.getAttribute('data-key');
        const value = chip.getAttribute('data-value');
        const entry = state.entries[currentDay-1];
        entry[key] = entry[key]===value ? '' : value;
        scheduleSave(); renderArc(); renderDay(); renderDayStrip();
        return;
      }
      const drop = e.target.closest('.droplet-toggle');
      if(drop){
        const key = drop.getAttribute('data-key');
        const entry = state.entries[currentDay-1];
        entry[key] = !entry[key];
        scheduleSave(); renderArc(); renderDay(); renderDayStrip();
        return;
      }
      const dot = e.target.closest('.scale-dot');
      if(dot){
        const key = dot.getAttribute('data-key');
        const num = parseInt(dot.getAttribute('data-num'),10);
        const entry = state.entries[currentDay-1];
        entry[key] = entry[key]===num ? 0 : num;
        scheduleSave(); renderArc(); renderDay(); renderDayStrip();
      }
    });
    document.getElementById('content').addEventListener('change', (e)=>{
      if(e.target.matches('input[type="time"]')){
        const key = e.target.getAttribute('data-key');
        state.entries[currentDay-1][key] = e.target.value;
        scheduleSave(); renderArc(); renderDayStrip();
      }
    });

    // swipe between days
    let touchX = null;
    const mainEl = document.querySelector('main');
    mainEl.addEventListener('touchstart', (e)=>{ touchX = e.changedTouches[0].clientX; }, {passive:true});
    mainEl.addEventListener('touchend', (e)=>{
      if(touchX===null || view!=='log') return;
      const dx = e.changedTouches[0].clientX - touchX;
      if(Math.abs(dx) > 60) goDay(currentDay + (dx<0?1:-1));
      touchX = null;
    }, {passive:true});

    document.getElementById('modalCancel').addEventListener('click', ()=>{
      document.getElementById('modalOverlay').classList.remove('show');
    });
    document.getElementById('modalConfirm').addEventListener('click', async ()=>{
      state = defaultState();
      currentDay = 1;
      document.getElementById('modalOverlay').classList.remove('show');
      await window.storage.set(STORAGE_KEY, JSON.stringify(state), false).catch(()=>{});
      renderArc(); renderDay(); renderDayStrip(); renderInsights();
      showToast('Cleared');
    });
  }

  function switchView(v){
    view = v;
    document.getElementById('tabLog').classList.toggle('active', v==='log');
    document.getElementById('tabInsights').classList.toggle('active', v==='insights');
    document.getElementById('content').style.display = v==='log' ? '' : 'none';
    document.getElementById('insightsBody').style.display = v==='insights' ? '' : 'none';
    document.querySelector('.arc-wrap').style.display = v==='log' ? '' : 'none';
    document.getElementById('arcCaption').style.display = v==='log' ? '' : 'none';
    document.getElementById('dayStrip').style.display = v==='log' ? '' : 'none';
    document.querySelector('.day-row').style.display = v==='log' ? '' : 'none';
    if(v==='insights') renderInsights();
  }

  async function init(){
    state = await loadData();
    currentDay = Math.min(TOTAL_DAYS, Math.max(1, state.lastDay||1));
    renderShell();
    renderArc();
    renderDay();
    renderDayStrip();
  }

  init();
})();
</script>
</body>
</html>
